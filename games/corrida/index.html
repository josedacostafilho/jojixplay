<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida dos Blocos · Estúdio</title><style>body{margin:0;background:#14123a;font-family:system-ui}body>header{height:55px;display:flex;align-items:center;gap:14px;padding:0 12px;color:#fff;font-size:11px;white-space:nowrap}body>header select{padding:7px;font:inherit}main{height:calc(100svh - 55px);position:relative}label{display:flex;align-items:center;gap:4px}</style></head><body><header><strong>Estúdio · Corrida</strong><label><input id="crouch" type="checkbox">Agachar (↓)</label><label><input id="jump" type="checkbox">Pular (↑)</label><label>Braços <select id="arms"><option value="down">Soltos</option><option value="out">Para os lados</option><option value="up">Para cima</option><option value="bent">Dobrados</option><option value="left">Só o esquerdo para cima</option><option value="right">Só o direito para cima</option></select></label><label>Soco (Q/E) <select id="punch"><option value="none">Nenhum</option><option value="left">Esquerdo</option><option value="right">Direito</option></select></label><label>Inclinar <select id="lean"><option value="0">Reto</option><option value="-1">Esquerda</option><option value="1">Direita</option></select></label><label><input id="small" type="checkbox">Criança ao longe</label><label><input id="lost" type="checkbox">Sem sinal</label></header><main></main><script type="module" src="/src/dev.ts"></script></body></html>
