<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Estúdio · Balanço</title>
  </head>
  <body>
    <main id="game" aria-label="Protótipo de balanço"></main>
    <aside class="studio">
      <strong>Estúdio · Balanço</strong>
      <button id="start" type="button">Começar / recomeçar (Espaço)</button>
      <button id="left" type="button" aria-pressed="false">Punho esquerdo (A)</button>
      <button id="right" type="button" aria-pressed="false">Punho direito (D)</button>
      <label>Mira E ↔ <input id="left-x" type="range" min="0.04" max="0.96" step="0.01" value="0.27" /></label>
      <label>Mira E ↕ <input id="left-y" type="range" min="0.04" max="0.96" step="0.01" value="0.4" /></label>
      <label>Mira D ↔ <input id="right-x" type="range" min="0.04" max="0.96" step="0.01" value="0.73" /></label>
      <label>Mira D ↕ <input id="right-y" type="range" min="0.04" max="0.96" step="0.01" value="0.4" /></label>
      <output id="status"></output>
    </aside>
    <script type="module" src="/src/dev.ts"></script>
  </body>
</html>
